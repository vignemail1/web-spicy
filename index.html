<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spicy_FR</title>
<meta name="description" content="Spicy_FR - Snipeuse dans l'âme. Warzone, Zombies, ARC Raiders. Rejoins le live !">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="#accueil" class="brand">
      <img src="assets/images/logo.svg" alt="Spicy_FR" class="brand-logo">
      <span class="brand-name">Spicy_FR</span>
    </a>
    <nav class="main-nav" id="main-nav"></nav>
    <a class="btn btn-live" id="live-link" href="#" target="_blank" rel="noopener">Live sur Twitch</a>
  </div>
</header>

<main>
  <section id="accueil" class="hero">
    <div class="container hero-inner">
      <div class="hero-text">
        <span class="badge-live">EN LIVE</span>
        <h1>Salut la team <span class="accent">Spicy</span></h1>
        <p class="tagline" id="hero-tagline"></p>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="hero-live-btn" href="#" target="_blank" rel="noopener">Rejoindre le Live</a>
          <a class="btn btn-outline" href="#setup">Voir le Setup</a>
        </div>
      </div>
      <div class="hero-avatar">
        <img id="avatar-img" src="assets/images/avatar.jpg" alt="Spicy_FR">
      </div>
    </div>
    <div class="container stats-bar" id="stats-bar"></div>
  </section>

  <section id="apropos" class="section about">
    <div class="container">
      <h2>À propos de moi</h2>
      <p class="section-text" id="about-text"></p>
      <div class="tags" id="about-tags"></div>
    </div>
  </section>

  <section id="setup" class="section setup">
    <div class="container">
      <h2>Mon Setup Gaming</h2>
      <p class="section-subtitle" id="setup-subtitle"></p>
      <div class="setup-image">
        <img id="setup-img" src="" alt="Setup Gaming Spicy_FR">
      </div>
      <div class="setup-features" id="setup-features">
        <img id="setup-feat" src="https://spicy-assets.vignemail1.eu/spicy-setup.png" alt="Détails Setup Gaming Spicy_FR">
      </div>
    </div>
  </section>

  <section id="partenaires" class="section partners">
    <div class="container">
      <h2>Nos Partenaires &amp; Codes Promos 🎁</h2>
      <p class="section-subtitle" id="partners-subtitle"></p>
      <div class="partners-grid" id="partners-grid"></div>
      <div class="partners-cta">
        <a class="btn btn-primary" id="partners-contact-btn" href="mailto:contact@spicy-fr.com">Devenir Partenaire</a>
        <p>Intéressé par un partenariat ? Contactez-moi !</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">Spicy_FR</div>
    <div class="footer-socials" id="footer-socials"></div>
    <p class="footer-copy">© 2026 Spicy_FR • Site communautaire non-officiel</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
