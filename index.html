<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spicy — Multigaming</title>
  <meta name="description" content="Spicy, streameuse multigaming : explore de nouveaux mondes, vivez et partagez de grandes histoires avec la communauté.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="nav" id="nav"></nav>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="accueil">
      <div class="frame frame-hero reveal">
        <h1 class="title-deco">Spicy<span class="spark">✦</span></h1>
        <p class="tagline" id="tagline">Chargement…</p>
        <div class="socials" id="socials"></div>
      </div>
    </section>

    <!-- QUI JE SUIS -->
    <section id="about">
      <div class="frame reveal">
        <h2 class="title-deco">Qui je suis</h2>
        <p class="about-text" id="about-text"></p>
        <ul class="about-list" id="about-list"></ul>
      </div>
    </section>

    <!-- JEUX -->
    <section id="jeux">
      <div class="frame reveal frame-wide">
        <h2 class="title-deco">Mes univers</h2>
        <div class="games-grid" id="games-grid"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact">
      <div class="frame reveal">
        <h2 class="title-deco">Contact</h2>
        <p class="contact-text">Retrouvez-moi sur mes réseaux ou laissez-moi un message :</p>
        <div class="socials" id="socials-contact"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Spicy — Fait avec ✦ et passion.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
